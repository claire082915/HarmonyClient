# Configuration for Harmony deployment scripts
# Used by build_nodes.py and start_services.py
#
# Required before running:
#   az login
#   export AZURE_SUBSCRIPTION_ID="<your-subscription-id>"

azure:
  username: csl12 #azureuser
  ssh_private_key: ~/.ssh/id_rsa #~/.ssh/azure-key.pem

resource_group:
  name: HORIZANN-RG
  location: centralus

cluster:
  vm_range: "1-11"        # horizann-4 = master, horizann-5 & 6 = workers
  num_workers: 10          

# Harmony dataset / index settings — passed to `query` (server) and `harmony_client`
experiment:
  benchmarks_path: /data/csl12/Harmony/benchmarks
  dataset: sift10m
  input_format: bvecs
  group: 2
  team: 2
  block: 4
  nprobe: 100
  nlist: 3162
  mode: base                         # group | base | etc.
  cache: true                         # pass --cache flag to load index from disk
  skip_insert: true                   # pass --skip_insert (requires --cache)
  k: 100
  query_batch: 5000                   
  query_loop: 1                       # repeat query phase N times

serve:
  nb: 10000000
  dim: 128
  train_data: "/data/csl12/Harmony/benchmarks/sift1m/origin/sift1m_base.fvecs"

# Client binary settings
client:
  base_file: "/data/csl12/Harmony/benchmarks/sift1b/origin/sift1b_base.bvecs"         # overrides experiment.benchmarks_path/dataset path if set
  query_file: "/data/csl12/Harmony/benchmarks/sift1b/origin/sift1b_query.bvecs"          # only needed when skip_insert: false
  groundtruth_file: "/data/csl12/Harmony/benchmarks/sift1b/origin/gnd/idx_10M.ivecs"   # overrides default groundtruth path if set
  nq: 0                  # 0 = all queries
  nb: 10000000
  insert_batch: 100000
  csv_path: "~/Harmony/benchmarks/sift10m/result/log_serve.csv"

# MPI launcher settings (used on master+worker nodes)
mpi:
  hosts_file: ~/mpi_hosts             # written by start_services.py from discovered IPs
  omp_num_threads: 64
  mpirun_bin: /home/csl12/intel/oneapi/mpi/2021.14/bin/mpirun
  # Total mpirun -n = 1 (master rank 0) + num_workers
  # Each line in hosts_file: <ip> slots=1

repo_url: https://github.com/claire082915/HarmonyClient
repo_branch: main
install_dir: ~/Harmony

# oneAPI / MKL environment — sourced before cmake and mpirun
oneapi_setvars: ~/intel/oneapi/setvars.sh #/opt/intel/oneapi/setvars.sh

# GCC-13 install prefix (set in CMakeLists; must exist on every node)
gcc_prefix: ~/gcc-13.2

local_logs_dir: ~/Harmony/harmony_logs       # local dir for --download-logs

